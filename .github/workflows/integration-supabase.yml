name: Integration Tests with Supabase

on:
  pull_request:
    branches:
      - main
    paths: &watched_paths
      - 'config/**'
      - 'assets/**'
      - 'lib/**'
      - 'priv/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'Dockerfile'
      - 'run.sh'
      - 'test/e2e/supabase/**'
      - '.github/workflows/integration-supabase.yml'
  push:
    branches:
      - main
    paths: *watched_paths

# Cancel old builds on new commit for same workflow + branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: test/e2e/supabase

jobs:
  build-image:
    name: Build Logflare image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Logflare image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: supabase/logflare:local
        outputs: type=docker,dest=/tmp/logflare-image.tar
        cache-from: type=gha,scope=integration-logflare
        cache-to: type=gha,scope=integration-logflare,mode=max
        pull: true

    - name: Upload Logflare image
      uses: actions/upload-artifact@v4
      with:
        name: logflare-image-${{ github.sha }}
        path: /tmp/logflare-image.tar
        compression-level: 0
        retention-days: 1

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build-image

    strategy:
      matrix:
        browsers:
          - name: Chrome
            project: chromium
          - name: Firefox
            project: firefox
          - name: Safari
            project: webkit

    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v6

    - name: Download Logflare image
      uses: actions/download-artifact@v4
      with:
        name: logflare-image-${{ github.sha }}
        path: /tmp/logflare-image

    - name: Load Logflare image
      run: docker load --input /tmp/logflare-image/logflare-image.tar
      working-directory: .

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: test/e2e/supabase/package-lock.json

    - name: Setup Supabase services
      run: bash ./setup-supabase-services.sh

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright ${{ matrix.browsers.name }} browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ matrix.browsers.project }}-${{ hashFiles('test/e2e/supabase/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ matrix.browsers.project }}-

    - name: Install Playwright ${{ matrix.browsers.name }} browser
      run: npx playwright install ${{ matrix.browsers.project }}

    - name: Install Playwright ${{ matrix.browsers.name }} system deps
      run: npx playwright install-deps ${{ matrix.browsers.project }}

    - name: Run Playwright tests (only ${{ matrix.browsers.name }})
      run: npx playwright test --project ${{ matrix.browsers.project }}

    - name: Capture container logs
      if: failure()
      run: |
        mkdir -p container-logs
        docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' > container-logs/_containers.txt
        for c in $(docker ps -a --format '{{.Names}}'); do
          docker logs --timestamps "$c" > "container-logs/${c}.log" 2>&1 || true
        done

    - name: Generate failure summary
      if: failure()
      run: bash ./ci-failure-summary.sh >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browsers.project }}
        path: test/e2e/supabase/playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: container-logs-${{ matrix.browsers.project }}
        path: test/e2e/supabase/container-logs/
        retention-days: 30
