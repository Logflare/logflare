name: Docker Nightly Release (GHCR)

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.env.outputs.short_sha }}
      version: ${{ steps.env.outputs.version }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup outputs
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat ./VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check for commits on main in the last 24 hours
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' -1)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: settings
    if: needs.settings.outputs.has_changes == 'true'
    strategy:
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: docker context create builders
      - uses: docker/setup-buildx-action@v4
        with:
          endpoint: builders
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:nightly-${{ needs.settings.outputs.short_sha }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            COMMIT_SHA=${{ needs.settings.outputs.short_sha }}
          cache-from: type=gha,scope=nightly-${{ matrix.arch }}
          cache-to: type=gha,scope=nightly-${{ matrix.arch }},mode=max

  merge_publish:
    needs:
      - settings
      - build
    if: needs.settings.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge multi-arch manifests and push nightly tags
        run: |
          image=ghcr.io/${{ github.repository }}
          sha_tag="${image}:nightly-${{ needs.settings.outputs.short_sha }}"
          docker buildx imagetools create \
            -t "$sha_tag" \
            -t "${image}:nightly" \
            "${sha_tag}-amd64" "${sha_tag}-arm64"
