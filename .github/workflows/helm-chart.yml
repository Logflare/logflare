name: Helm Chart

on:
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-chart.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      # Neither plugin ships the provenance metadata Helm 4 verifies by default, so installing
      # them at all means opting out of that check.
      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest

      - name: Install helm-values-schema-json plugin
        run: helm plugin install --verify=false https://github.com/losisin/helm-values-schema-json

      - name: Ensure values.schema.json matches values.yaml
        working-directory: helm
        run: |
          helm schema
          if ! git diff --quiet --exit-code values.schema.json; then
            echo "::error::values.schema.json is stale. Run 'helm schema' in helm/ and commit the result."
            git diff values.schema.json
            exit 1
          fi

      - name: Lint chart
        run: helm lint helm

      - name: Run unit tests
        run: helm unittest -f '*_test.yaml' helm

      - name: Template chart with default values
        run: helm template helm

      # Argo Rollouts CRDs are not part of the Kubernetes API, so the Rollout this chart renders is
      # checked against the CRD schemas published by the controller release it targets.
      - name: Validate rendered manifests against Kubernetes and CRD schemas
        env:
          KUBECONFORM_VERSION: v0.8.0
          # Checksum of scripts/openapi2jsonschema.py at the tag above. Bump both together.
          OPENAPI2JSONSCHEMA_SHA256: d145babfbb765004030764e1b4e518bfb7a4bd7f111691a08fa57983b81881f3
          ARGO_ROLLOUTS_VERSION: v1.9.1
        run: |
          set -euo pipefail
          release="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSLo kubeconform.tar.gz "${release}/kubeconform-linux-amd64.tar.gz"
          curl -sSLo kubeconform-checksums.txt "${release}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-checksums.txt \
            | sed 's/kubeconform-linux-amd64.tar.gz/kubeconform.tar.gz/' \
            | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform

          curl -sSLo openapi2jsonschema.py \
            "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py"
          echo "${OPENAPI2JSONSCHEMA_SHA256}  openapi2jsonschema.py" | sha256sum --check --strict

          python3 -m venv .crdvenv
          ./.crdvenv/bin/pip install --quiet "pyyaml==6.0.2"

          mkdir -p crd-schemas
          crd_url="https://raw.githubusercontent.com/argoproj/argo-rollouts/${ARGO_ROLLOUTS_VERSION}/manifests/crds"
          cd crd-schemas
          FILENAME_FORMAT='{kind}_{version}' ../.crdvenv/bin/python ../openapi2jsonschema.py \
            "${crd_url}/rollout-crd.yaml" \
            "${crd_url}/analysis-template-crd.yaml"
          cd ..

          helm template helm | ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Ensure chart version has been bumped
        # Skipped when only the workflow changed: a chart version bump alters the pod template
        # checksum and restarts every replica, so CI must not demand one for a CI-only edit.
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- helm; then
            echo "No changes under helm/; skipping the version check."
            exit 0
          fi
          head_version=$(helm show chart helm | awk '/^version:/ {print $2}')
          base_version=$(git show "origin/${{ github.base_ref }}:helm/Chart.yaml" 2>/dev/null | awk '/^version:/ {print $2}')

          echo "Base (${{ github.base_ref }}) chart version: ${base_version:-<none>}"
          echo "Head chart version: $head_version"

          if [ -z "$base_version" ]; then
            echo "No chart on base branch; treating as new chart."
            exit 0
          fi

          if [ "$head_version" = "$base_version" ]; then
            echo "::error::Chart version has not been bumped (still $head_version). Update version in helm/Chart.yaml."
            exit 1
          fi

          highest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -n1)
          if [ "$highest" != "$head_version" ]; then
            echo "::error::Chart version $head_version is lower than base version $base_version."
            exit 1
          fi

          echo "Chart version bumped: $base_version -> $head_version"
