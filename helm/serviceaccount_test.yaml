suite: test service account
templates:
  - serviceaccount.yaml
tests:
  # Logflare never calls the Kubernetes API, so the token is only a credential an attacker
  # could reach.
  - it: should not automount the API token by default
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        template: serviceaccount.yaml

  - it: should automount the API token when serviceAccount.automount is set
    set:
      serviceAccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        template: serviceaccount.yaml
