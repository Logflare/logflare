name: Docker Build Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'priv/**'
      - 'rel/**'
      - 'config/**'
      - 'assets/**'
      - 'Dockerfile'
      - 'Dockerfile.multi-step'
      - 'Dockerfile.base'
      - 'Dockerfile.runner'
      - '.dockerignore'
      - '!assets/**'
      - '*.sh'
      - '.tool-versions'
      - 'bin/docker-base-images'
      - 'bin/docker_base_images.py'
      - 'test/bin/docker_base_images_test.py'
      # Run suite when this file is changed
      - ".github/workflows/docker-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker base images
        run: |
          python3 -m unittest discover -s test/bin -p '*_test.py' -v
          python3 bin/docker-base-images check --warn-age-days 45
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          push: false
          pull: true
          load: true
          tags: logflare:security-scan
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-build-check
          cache-to: type=gha,scope=docker-build-check,mode=max
      - name: Audit production image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logflare:security-scan
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
