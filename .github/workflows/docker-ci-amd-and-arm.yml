name: Docker CI Multi-Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "test/**"
      - "bench/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.env.outputs.version}}
      short_sha: ${{steps.env.outputs.short_sha}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup outputs
        id: env
        run: |
          echo "version=$(cat ./VERSION)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate Docker base images
        run: python3 bin/docker-base-images check --warn-age-days 45 --fail-age-days 90
  build:
    needs: settings
    strategy:
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # checkout git commit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Setup docker
      # https://github.com/supabase/postgres/blob/develop/.github/workflows/dockerhub-release.yml#LL41C11-L42C44
      - run: docker context create builders
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          endpoint: builders
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build and push
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          tags: supabase/logflare:dev-${{ needs.settings.outputs.short_sha }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          # Baked into the image as LOGFLARE_COMMIT_SHA and emitted as an OTel
          # resource attribute at runtime (see Dockerfile / Logflare.Telemetry).
          build-args: |
            COMMIT_SHA=${{ needs.settings.outputs.short_sha }}
          # Keep architecture-specific caches from overwriting each other.
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max
      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge_publish:
    needs:
      - settings
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Setup tags
        run: echo "tag_sha=supabase/logflare:dev-${{ needs.settings.outputs.short_sha }}" >> "$GITHUB_ENV"
      - name: Staging - Merge multi-arch manifests and push the dev image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sources=()
          for digest in /tmp/digests/*; do
            sources+=("supabase/logflare@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t ${{ env.tag_sha }} "${sources[@]}"
      - name: Verify image attestations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 bin/check-image-attestations ${{ env.tag_sha }}

  trigger_cloudbuild:
    uses: ./.github/workflows/trigger-cloudbuild.yml
    needs:
      - settings
      - build
      - merge_publish
    secrets: inherit