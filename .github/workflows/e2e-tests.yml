name: E2E Tests (with Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * SUN"
  pull_request:
    branches: ["**"]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "assets/**"
      - "lib/**"
      - "config/**"
      - "*.exs"
      - "*.lock"
      - "native/**"
      - "priv/**"
      - "test/e2e/features/**"
      - "test/support/**"
      - "test/test_helper.exs"
      # Run suite when this file is changed
      - ".github/workflows/e2e-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Get versions
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.v.outputs.elixir }}
      erlang: ${{ steps.v.outputs.erlang }}
      rust: ${{ steps.v.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - name: Read versions from .tool-versions
        id: v
        run: |
          echo "elixir=$(grep '^elixir '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "erlang=$(grep '^erlang '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "rust=$(grep   '^rust '    .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

  test:
    name: Tests with Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: versions

    services:
      postgres:
        image: bitnamilegacy/postgresql:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logflare_test
          POSTGRESQL_WAL_LEVEL: logical
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "pg_isready -d logflare_test -U postgres -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: logflare_test
          CLICKHOUSE_USER: logflare
          CLICKHOUSE_PASSWORD: logflare
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --memory="1500m"
          --memory-reservation="512m"
          --cpus="1.0"
          --shm-size="256m"
          --tmpfs /var/lib/clickhouse:rw,size=1G
          --tmpfs /var/log/clickhouse-server:rw,size=100M

    env:
      MIX_ENV: test
      SHELL: /bin/bash
      E2E: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: npm ci --prefix assets
      - run: npx --prefix assets playwright install --with-deps

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-e2e-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-e2e-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-e2e-

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-e2e-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-e2e-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-e2e-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Build assets
        run: npm run deploy --prefix assets

      - name: Run Tests
        run: mix test.e2e
