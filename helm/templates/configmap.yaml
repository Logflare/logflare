{{/*
Assembled as a single dict rather than emitted inline, so a key that `extraConfig` also sets
overrides the derived value instead of appearing twice. A duplicated key leaves which value wins up
to whatever parses the manifest.
*/}}
{{- $config := dict }}
{{- $_ := set $config "LOGFLARE_SINGLE_TENANT" .Values.logflare.singleTenant }}
{{- $_ = set $config "LOGFLARE_SUPABASE_MODE" .Values.logflare.supabaseMode }}
{{- $_ = set $config "LOGFLARE_GRPC_PORT" .Values.logflare.grpcPort }}
{{- $_ = set $config "LOGFLARE_HTTP_CONNECTION_POOLS" .Values.logflare.httpConnectionPools }}
{{- if .Values.logflare.featureFlagOverride }}
{{- $_ = set $config "LOGFLARE_FEATURE_FLAG_OVERRIDE" .Values.logflare.featureFlagOverride }}
{{- end }}

{{- $_ = set $config "PHX_HTTP_PORT" .Values.logflare.phx.httpPort }}
{{- if .Values.logflare.phx.urlHost }}
{{- $_ = set $config "PHX_URL_HOST" .Values.logflare.phx.urlHost }}
{{- end }}
{{- $_ = set $config "PHX_URL_SCHEME" .Values.logflare.phx.urlScheme }}
{{- $_ = set $config "PHX_URL_PORT" .Values.logflare.phx.urlPort }}
{{- $_ = set $config "PHX_CHECK_ORIGIN" .Values.logflare.phx.checkOrigin }}

{{- $_ = set $config "DB_HOSTNAME" .Values.logflare.db.hostname }}
{{- $_ = set $config "DB_PORT" .Values.logflare.db.port }}
{{- $_ = set $config "DB_DATABASE" .Values.logflare.db.database }}
{{- $_ = set $config "DB_USERNAME" .Values.logflare.db.username }}
{{- $_ = set $config "DB_SCHEMA" .Values.logflare.db.schema }}
{{- $_ = set $config "DB_POOL_SIZE" .Values.logflare.db.poolSize }}
{{- $_ = set $config "DB_SSL" .Values.logflare.db.ssl }}

{{- if eq .Values.logflare.backend.type "bigquery" }}
{{- $_ = set $config "GOOGLE_PROJECT_ID" .Values.logflare.backend.bigquery.projectId }}
{{- $_ = set $config "GOOGLE_PROJECT_NUMBER" .Values.logflare.backend.bigquery.projectNumber }}
{{- $_ = set $config "GOOGLE_DATASET_ID_APPEND" .Values.logflare.backend.bigquery.datasetIdAppend }}
{{- $_ = set $config "GOOGLE_DATASET_LOCATION" .Values.logflare.backend.bigquery.datasetLocation }}
{{- else if eq .Values.logflare.backend.type "postgres" }}
{{- $_ = set $config "POSTGRES_BACKEND_SCHEMA" .Values.logflare.backend.postgres.schema }}
{{- else }}
{{- fail (printf "logflare.backend.type must be 'bigquery' or 'postgres', got %q" .Values.logflare.backend.type) }}
{{- end }}

{{- range $key, $value := .Values.logflare.extraConfig }}
{{- $_ = set $config $key $value }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logflare.fullname" . }}
  labels:
    {{- include "logflare.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
