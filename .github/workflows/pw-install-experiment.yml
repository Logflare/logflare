name: pw-install-experiment

on:
  push:
    branches: [zn/vibrant-franklin-l5na4e]
    paths: [".github/workflows/pw-install-experiment.yml"]

permissions:
  contents: read

jobs:
  prime-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: assets/package-lock.json }
      - run: npm ci --prefix assets
      - id: v
        run: echo "pw=$(node -p "require('./assets/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-exp2-${{ runner.os }}-${{ steps.v.outputs.pw }}-chromium
      - run: npx --prefix assets playwright install --with-deps chromium

  install:
    needs: prime-cache
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [all, chromium, headless-shell, chromium-cached]
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: assets/package-lock.json }
      - run: npm ci --prefix assets
      - id: v
        run: echo "pw=$(node -p "require('./assets/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.variant == 'chromium-cached'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-exp2-${{ runner.os }}-${{ steps.v.outputs.pw }}-chromium
      - name: playwright-install
        run: |
          case "${{ matrix.variant }}" in
            all) args="" ;;
            headless-shell) args="chromium-headless-shell" ;;
            *) args="chromium" ;;
          esac
          npx --prefix assets playwright install --with-deps $args 2>&1 | tee pw.log
          grep -E "Need to get|newly installed|downloaded to" pw.log || true
          du -sh ~/.cache/ms-playwright/* || true
