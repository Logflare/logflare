# Stand-in Logstash for local testing of the Elastic backend's `logstash` transport.
# Note: Logflare's outbound HTTP is SSRF-protected and rejects private/loopback
# addresses, so point the backend at a tunnel (e.g. `ngrok http 8080`) rather
# than http://localhost:8080.
input {
  http {
    port => 8080
    codec => json
    # basic auth, matches the Elastic backend's username/password config
    # user => "logflare"
    # password => "changeme"
  }
}

output {
  stdout {
    codec => rubydebug
  }
}
