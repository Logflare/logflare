name: Elixir CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "assets/**"
      - "lib/**"
      - "config/**"
      - "*.exs"
      - "*.lock"
      - "Dockerfile.base"
      - "Dockerfile.runner"
      - "Dockerfile.multi-step"
      - "docs/docs.logflare.com/docs/**"
      - "native/**"
      - "priv/**"
      - "test/**"
      - "!test/e2e/supabase/**"
      - ".github/scripts/**"
      # Run suite when this file is changed
      - ".github/workflows/elixir-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Get versions
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.v.outputs.elixir }}
      erlang: ${{ steps.v.outputs.erlang }}
      rust: ${{ steps.v.outputs.rust }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      quality: ${{ steps.changes.outputs.quality }}
      rust_changed: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read versions from .tool-versions
        id: v
        run: |
          echo "elixir=$(grep '^elixir '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "erlang=$(grep '^erlang '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "rust=$(grep   '^rust '    .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Detect affected checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          backend=true
          frontend=true
          quality=true
          rust=true

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch: running all checks"
          elif git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            && changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            backend=false
            frontend=false
            quality=false
            rust=false

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/elixir-ci.yml)
                  backend=true
                  frontend=true
                  rust=true
                  ;;
                assets/*)
                  frontend=true
                  ;;
                .tool-versions|Cargo.toml|Cargo.lock|native/mapper_ex/*)
                  backend=true
                  rust=true
                  ;;
                test/e2e/features/*)
                  quality=true
                  ;;
                test/e2e/*)
                  ;;
                .github/scripts/*|config/*|docs/docs.logflare.com/docs/*|lib/*|native/*|priv/*|test/*|*.exs|*.lock|Dockerfile.base|Dockerfile.runner|Dockerfile.multi-step)
                  backend=true
                  ;;
              esac
            done <<< "$changed"
          else
            echo "::warning::Unable to determine changed files; running all checks"
          fi

          if [[ "$backend" == "true" ]]; then
            quality=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  quality:
    name: Checks (${{ matrix.commands.name }}, ${{ matrix.commands.run }})
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.quality == 'true'
    strategy:
      matrix:
        commands:
          - name: Code Quality - Linting
            run: mix lint.all
          - name: Code Quality - Formatting
            run: mix test.format
          - name: Code Quality - Duplication
            run: mix test.slop
          - name: Code Quality - Structure
            run: mix test.structure
          - name: Code Quality - Dependency advisories
            run: mix test.deps
            soft: true
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Run ${{ matrix.commands.name }}
        run: ${{ matrix.commands.run }}
        continue-on-error: ${{ matrix.commands.soft || false }}

  compile:
    name: Checks (Compilation Warnings, mix test.compile)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.backend == 'true'
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Run compilation checks
        run: mix test.compile

  typing:
    name: Checks (Typing check, mix test.typings)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.backend == 'true'
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v5
        with:
          path: dialyzer
          key: plt-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-
            plt-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Run typing checks
        run: mix test.typings

  test:
    name: Checks (Tests, epmd -daemon; mix do ecto.create + ecto.migrate + test.coverage.ci)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.backend == 'true'
    services:
      postgres:
        image: bitnamilegacy/postgresql:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logflare_test
          POSTGRESQL_WAL_LEVEL: logical
        options: >-
          --health-cmd "pg_isready -d logflare_test -U postgres -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: logflare_test
          CLICKHOUSE_USER: logflare
          CLICKHOUSE_PASSWORD: logflare
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --memory="1500m"
          --memory-reservation="512m"
          --cpus="1.0"
          --shm-size="256m"
          --tmpfs /var/lib/clickhouse:rw,size=1G
          --tmpfs /var/log/clickhouse-server:rw,size=100M
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Telegraf Output Dir
        run: |
          mkdir -p db/telegraf_output
          touch db/telegraf_output/metrics.out
          chmod 666 db/telegraf_output/metrics.out

      - name: Start Telegraf
        run: docker compose up -d telegraf

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ github.job }}-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Run tests
        run: epmd -daemon; mix do ecto.create + ecto.migrate + test.coverage.ci

      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          file: cover/lcov.info
          format: lcov
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.rust_changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/mapper_ex/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-

      - name: Run mapper Rust unit tests
        run: cargo test -p mapper_ex

  frontend:
    name: Frontend JavaScript Unit Tests (assets)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix assets

      - name: Run frontend JavaScript unit tests
        run: npm test --prefix assets
